name: drift_sounds
version: 0.1.0
description: "A library for storing `flutter_audio_games` sounds in a drift sqlite database."
homepage: https://github.com/chrisnorman7/drift_sounds

environment:
  sdk: ^3.11.4
  flutter: ">=1.17.0"

dependencies:
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  drift_sounds_database: ^0.2.0
  flutter:
    sdk: flutter
  flutter_audio_games: ^0.52.0
  flutter_soloud: ^4.0.2
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
